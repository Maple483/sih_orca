<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORCA Marine Intelligence</title>
    <!-- Leaflet CSS and JS mapping links required by window.L in App.tsx -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
      #orca-productivity-enhanced{position:fixed;inset:0;z-index:99999;background:#020617;color:#e2e8f0;font-family:ui-sans-serif,system-ui,sans-serif;overflow:auto}
      #orca-productivity-enhanced *{box-sizing:border-box}.pe-shell{min-height:100%;background:radial-gradient(circle at top right,#0f2b3a 0,#020617 38%)}
      .pe-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 28px;border-bottom:1px solid #1e293b;background:rgba(2,6,23,.94);backdrop-filter:blur(12px)}.pe-title{font-size:20px;font-weight:800}.pe-sub{font-size:11px;color:#64748b;margin-top:3px}.pe-head button,.pe-controls button{border:1px solid #334155;background:#0f172a;color:#cbd5e1;border-radius:9px;padding:9px 13px;cursor:pointer}.pe-head button:hover,.pe-controls button:hover{background:#1e293b}
      .pe-controls{display:flex;flex-wrap:wrap;align-items:end;gap:12px;padding:15px 28px;border-bottom:1px solid #1e293b;background:#0b1220}.pe-controls label{display:flex;flex-direction:column;gap:5px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#64748b}.pe-controls select{min-width:190px;background:#020617;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:9px;font-size:13px;text-transform:none;letter-spacing:normal}.pe-controls button{background:#059669;border-color:#10b981;color:white;font-weight:700}.pe-controls button:hover{background:#10b981}.pe-controls span{font-size:11px;color:#64748b;padding-bottom:10px}
      .pe-content{max-width:1100px;margin:auto;padding:24px 28px 60px;display:flex;flex-direction:column;gap:18px}.pe-card{background:rgba(15,23,42,.78);border:1px solid #1e293b;border-radius:15px;padding:17px;box-shadow:0 10px 30px rgba(0,0,0,.15)}.pe-card h3{font-size:13px;margin:0 0 13px;color:#cbd5e1}.pe-scroll{overflow-x:auto}.pe-svg{display:block;width:100%;min-width:720px;height:280px}.pe-svg .grid line{stroke:#334155;stroke-width:1}.pe-svg .grid text{fill:#94a3b8;font-size:11px}.pe-svg .axis{stroke:#64748b;stroke-width:1}.pe-svg .line{fill:none;stroke:#22d3ee;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.pe-svg circle{fill:#22d3ee;stroke:#083344;stroke-width:1}.pe-svg .year{fill:#94a3b8;font-size:10px}.pe-svg .barlabel{fill:#94a3b8;font-size:10px}.pe-svg rect{fill:#10b981;opacity:.82}.pe-empty{text-align:center;color:#64748b;padding:50px 10px;font-size:13px}.pe-error{color:#fca5a5;background:#450a0a;border:1px solid #7f1d1d;border-radius:10px;padding:14px}.pe-summary{background:#0f172a;border:1px solid #1e293b;border-radius:15px;padding:18px}.pe-summary b{color:#f1f5f9}.pe-summary span{color:#64748b}.pe-summary p{font-size:13px;line-height:1.65;color:#cbd5e1;margin:11px 0}.pe-summary small{display:block;color:#fbbf24aa;margin-top:12px;line-height:1.5}.pe-pill{float:right!important;color:#34d399!important;border:1px solid #065f46;border-radius:999px;padding:4px 9px;font-size:10px!important}.pe-effects{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pe-effects>div{border:1px solid #1e293b;border-radius:10px;padding:10px;font-size:11px;color:#94a3b8}.pe-effects b{color:#e2e8f0}.pe-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pe-big{font-size:28px;font-weight:800;color:#f8fafc}.pe-note{font-size:11px;color:#fbbf24aa;line-height:1.5}
      .pe-pfz-controls{display:flex;flex-wrap:wrap;align-items:end;gap:10px;margin-bottom:14px}.pe-pfz-controls label{display:flex;flex-direction:column;gap:5px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;flex:1;min-width:150px}.pe-pfz-controls input{width:100%;background:#020617;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:9px;font-size:13px}.pe-pfz-controls button{border:1px solid #334155;background:#0f172a;color:#cbd5e1;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:700}.pe-pfz-controls button:last-child{background:#0891b2;border-color:#22d3ee;color:#fff}.pe-pfz-controls button:hover{filter:brightness(1.12)}.pe-pfz-summary{border:1px solid #164e63;background:#082f49aa;border-radius:11px;padding:12px;margin-bottom:10px}.pe-pfz-summary b{display:block;color:#f1f5f9;font-size:13px}.pe-pfz-summary span{display:block;color:#67e8f9;font-size:11px;margin-top:3px}.pe-pfz-meta{font-size:10px;color:#94a3b8;margin-top:7px;line-height:1.5}.pe-pfz-list{display:flex;flex-direction:column;gap:8px}.pe-pfz-row{display:grid;grid-template-columns:30px 1fr 58px;gap:10px;align-items:start;border:1px solid #1e293b;background:#0b1220;border-radius:11px;padding:10px}.pe-pfz-row.best{border-color:#0891b2;background:#08334455}.pe-pfz-rank{width:26px;height:26px;border-radius:50%;background:#1e293b;display:flex;align-items:center;justify-content:center;color:#67e8f9;font-size:11px;font-weight:800}.pe-pfz-title{font-size:12px;font-weight:800;color:#f8fafc}.pe-pfz-sub{font-size:9px;color:#64748b;margin-top:3px;line-height:1.45}.pe-best-pill{display:inline-block!important;color:#67e8f9!important;border:1px solid #0e7490;border-radius:999px;padding:2px 5px;font-size:8px!important;margin-left:5px}.pe-pfz-metrics{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.pe-pfz-metrics span{font-size:9px;color:#94a3b8;background:#020617;border:1px solid #1e293b;border-radius:6px;padding:4px 6px}.pe-pfz-metrics b{color:#e2e8f0}.pe-pfz-score{text-align:center;border-left:1px solid #1e293b;padding-left:8px}.pe-pfz-score b{display:block;font-size:20px;color:#67e8f9}.pe-pfz-score small{font-size:8px;color:#64748b}.pe-pfz-box .pe-note{margin-top:10px}
      @media(max-width:700px){.pe-head{padding:14px 16px}.pe-controls,.pe-content{padding-left:16px;padding-right:16px}.pe-head{align-items:flex-start}.pe-title{font-size:17px}.pe-effects,.pe-two{grid-template-columns:1fr}.pe-controls select{min-width:160px}.pe-svg{min-width:680px}.pe-pfz-row{grid-template-columns:28px 1fr}.pe-pfz-score{display:none}.pe-pfz-controls label{min-width:130px}}
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/productivity-enhancements.js"></script>
    <script src="/satellite-maps.js"></script>
  </body>
</html>
